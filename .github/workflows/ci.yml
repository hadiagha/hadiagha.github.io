name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only. This workflow never publishes anything.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Build
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Validate HTML, links and images
        # The mailto ignore covers the share-by-email button, which is
        # deliberately recipient-less so the reader fills it in.
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --allow-hash-href \
            --ignore-urls "/^mailto:\?/"

      - name: Reject oversized files
        run: |
          # Video, datasets and model files belong on YouTube, in a release,
          # or in their own repo — never in the site history.
          large=$(find . -path ./.git -prune -o -type f -size +2M -print)
          if [ -n "$large" ]; then
            echo "::error::Files over 2 MB were added:"
            echo "$large"
            exit 1
          fi
          echo "No oversized files."
