name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the token can read the repo and publish Pages, nothing else.
# It cannot write to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let an in-flight production deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned, not ubuntu-latest. When GitHub moved ubuntu-latest to 26.04,
    # setup-ruby had no prebuilt Ruby 3.3.6 for it and every build 404'd
    # before Jekyll ran. A pinned image changes only when we change it.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Build search index
        # Pagefind reads the generated HTML, so it has to run after Jekyll and
        # before the artifact is packed. Pinned to the same version the local
        # image installs (see Dockerfile): the index format and the client
        # script are versioned together, and a mismatch is a search box that
        # loads and then finds nothing.
        run: npx -y pagefind@1.5.2 --site _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
