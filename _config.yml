# Site settings
title: Hadi Aghazadeh
tagline: Contemplations on AI, RL, LLMs, optimization, and scientific adventures
description: >-
  Welcome to my website! This is the place where I share my thoughts on AI, reinforcement learning, and any sort of scientific adventures related to these topics. I love to share my personal reflections on the books and papers I read here as well.
author:
  name: Hadi Aghazadeh, PhD
  email: hadi@hadiaghazadeh.com
  bio: "Senior Data Scientist at Enverus, PhD from University of Calgary, and author of 'Applied Reinforcement Learning' (Manning)."
  avatar: /assets/images/hadi_pic.png
  social:
    twitter: hadi_aghazadeh
    github: hadiagha
    linkedin: hadi-aghazadeh
    google_scholar: maIEW1AAAAAJ
    youtube: philo_ai 
    orcid: 0000-0002-7631-3738

# Book. Referenced by the homepage, the book page and the structured data.
book:
  title: Applied Reinforcement Learning
  subtitle: Business optimization and LLM fine-tuning
  publisher: Manning Publications
  status: Manning Early Access Program
  release: January 2027
  isbn: "9781633434844"
  manning: https://www.manning.com/books/applied-reinforcement-learning
  github: https://github.com/hadiagha/applied-reinforcement-learning
  cover: /assets/rl_book/ARL_Book_Cover.jpg

# URL settings
# Canonical host. Everything absolute — canonical tags, Open Graph, the sitemap,
# the Atom feed, citation blocks — is built from this, so it must not be changed
# before the TLS certificate exists for the domain.
url: "https://hadiaghazadeh.com"
baseurl: ""

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax

# Dart Sass emits a source map alongside main.css by default; we don't ship one.
# `compressed` is explicit because Jekyll 3 compressed by default and Jekyll 4
# does not — without it the migration would silently inflate main.css 6x.
sass:
  sourcemap: never
  style: compressed

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/
  
# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      # Content kind: article | note | review | essay. Articles are the default
      # and render without a badge — see _layouts/post.html.
      kind: "article"
      share: true
      
# Pagination
paginate: 10
paginate_path: "/page:num/"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

# SEO
twitter:
  username: hadi_aghazadeh
  card: summary_large_image

# Analytics. Cloudflare Web Analytics; cookieless and loaded only in production.
# Leave empty and no analytics script is emitted at all — the previous
# UA-XXXXXXXXX-X placeholder was truthy to Liquid and shipped a live request to
# a Universal Analytics property that no longer exists.
# The site tag for Cloudflare Web Analytics. This is public by design — it ships
# in the HTML of every page — so it belongs in the repository rather than in a
# CI secret. It is write-only: it accepts pageviews and cannot read the
# dashboard, so it is not a credential.
#
# If this is ever blanked out, leave it with NO value rather than "". An empty
# string is TRUTHY in Liquid — only nil and false are falsy — which is exactly
# how the old UA-XXXXXXXXX-X placeholder shipped a live script tag to a property
# that no longer existed. The guard in _layouts/default.html tests != "" for
# that reason; do not rely on the guard alone.
#
# Automatic (edge-injected) setup does not work here and never will: it requires
# the domain to be proxied through Cloudflare, and the DNS records are
# deliberately DNS-only so GitHub can issue the TLS certificate. This is the
# JS-snippet setup instead.
cloudflare_analytics_token: "74fffd7e11584509bb94054ff4c38cf9"

# Comments are intentionally absent. The previous Disqus block held a
# placeholder shortname, so every post requested a nonexistent subdomain.
# giscus (GitHub Discussions) is the planned replacement.

# Build exclusions. This list REPLACES Jekyll's defaults, so the Ruby/Node
# entries have to be restated rather than assumed.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .ruby-version
  - Dockerfile
  - docker-compose.yml
  - Makefile
  - README.md
  - WRITING.md
  # Gitignored personal runbook, so the deploy never sees it — excluded here as
  # well so a local build cannot publish it either.
  - DEPLOY.md
  - scripts
  - .github
  - .dockerignore
